<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매크로 지표 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
:root{
  --bg:#EDF0F3; --panel:#FFFFFF; --ink:#18212C; --muted:#5E6B7A;
  --line:#D4DAE1; --navy:#23446F; --up:#C0392B; --down:#1F5FAD; --warn:#9A6B00;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;
  border-bottom:2px solid var(--navy);padding-bottom:12px;margin-bottom:20px}
h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}
.meta{color:var(--muted);font-size:12.5px}
.range{display:flex;border:1px solid var(--navy);border-radius:4px;overflow:hidden}
.range button{border:0;background:var(--panel);color:var(--navy);padding:6px 16px;
  font:inherit;font-weight:500;cursor:pointer}
.range button+button{border-left:1px solid var(--navy)}
.range button[aria-pressed="true"]{background:var(--navy);color:#fff}
.range button:focus-visible{outline:2px solid var(--up);outline-offset:-2px}
.tbl-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:12.5px;background:#F6F8FA}
th:first-child,td:first-child,th:last-child,td:last-child{text-align:left}
tr.grp td{background:#F6F8FA;color:var(--navy);font-weight:600;font-size:12.5px;text-align:left}
tr:last-child td{border-bottom:0}
.up{color:var(--up)} .down{color:var(--down)}
.flag{display:inline-block;margin-left:6px;padding:0 5px;border-radius:3px;font-size:11px;
  border:1px solid var(--warn);color:var(--warn)}
.src{color:var(--muted);font-size:12.5px}
h2{font-size:15px;font-weight:600;color:var(--navy);margin:28px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 12px 4px}
.card h3{margin:0;font-size:14px;font-weight:600}
.card .v{font-size:20px;font-weight:600}
.card .sub{color:var(--muted);font-size:12px}
.chart{height:220px}
.err{color:var(--up);font-size:12.5px;padding:24px 0}
footer{margin-top:28px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>매크로 지표 대시보드</h1>
      <div class="meta" id="gen"></div>
    </div>
    <div class="range" role="group" aria-label="차트 기간">
      <button data-y="1">1년</button>
      <button data-y="3" aria-pressed="true">3년</button>
      <button data-y="5">5년</button>
    </div>
  </header>

  <div class="tbl-wrap">
    <table>
      <thead><tr><th>지표</th><th>최신값</th><th>기준일</th><th>1일</th><th>1개월</th><th>1년</th><th>출처</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div id="charts"></div>

  <footer>
    변동폭: 금리는 bp, 그 외는 %. 1일 변동은 직전 관측일 대비입니다.
    '예비 소스'는 우선 소스 수집에 실패해 대체 소스를 쓴 경우, '지연'은 최종 관측일이 7일 이상 지난 경우, '이전 데이터'는 이번 실행에서 수집에 실패해 직전 저장분을 표시한 경우입니다.
  </footer>
</div>

  if (v == null) return '<td>–</td>';
  const cls = v > 0 ? "up" : v < 0 ? "down" : "";

  return `<td class="${cls}">${s}</td>`;
}

  let f = "";

  if (it.fallback) f += '<span class="flag">예비 소스</span>';

  return f;

  Plotly.newPlot("c-"+it.key, [{x:it.dates, y:it.values, type:"scatter", mode:"lines",

}

function setRange(years){
  for (const it of live){
    const end = it.dates[it.dates.length-1];
    const d = new Date(end); d.setFullYear(d.getFullYear() - years);
    const start = d.toISOString().slice(0,10);
    const vis = it.values.filter((v,i) => it.dates[i] >= start);
    const lo = Math.min(...vis), hi = Math.max(...vis), pad = (hi - lo) * 0.06 || 1;
    Plotly.relayout("c-"+it.key, {"xaxis.range":[start, end], "yaxis.range":[lo-pad, hi+pad]});
  }
  document.querySelectorAll(".range button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.y == years ? "true" : "false"));
}
document.querySelectorAll(".range button").forEach(b => b.addEventListener("click", () => setRange(+b.dataset.y)));
